name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Install dependencies
        run: |
          npm ci
          composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Build CSS
        run: npm run build

      - name: Create release directory
        run: |
          mkdir -p release/ihumbak-chat

      - name: Copy plugin files
        run: |
          cp -r includes/ release/ihumbak-chat/
          cp -r admin/ release/ihumbak-chat/
          cp -r public/ release/ihumbak-chat/
          cp -r assets/ release/ihumbak-chat/
          cp -r languages/ release/ihumbak-chat/
          cp ihumbak-chat.php release/ihumbak-chat/
          cp README.md release/ihumbak-chat/ || true
          cp LICENSE release/ihumbak-chat/ || true

      - name: Create ZIP archive
        run: |
          cd release
          zip -r ihumbak-chat-${{ github.ref_name }}.zip ihumbak-chat/
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/ihumbak-chat-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
